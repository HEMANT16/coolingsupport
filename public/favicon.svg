<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Vibrant blue-to-cyan gradient -->
    <linearGradient id="coolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <!-- Soft drop shadow for premium depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular background frame with a premium gradient ring -->
  <circle cx="64" cy="64" r="58" fill="url(#coolGradient)" filter="url(#dropShadow)" />
  <circle cx="64" cy="64" r="50" fill="#0f172a" />

  <!-- Symmetrical 6-Pointed Snowflake -->
  <g transform="translate(64, 64)" stroke="url(#coolGradient)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Define a single branch -->
    <g id="branch">
      <line x1="0" y1="0" x2="0" y2="-38" />
      <!-- Outer V-Spurs -->
      <path d="M -9 -21 L 0 -30 L 9 -21" fill="none" />
      <!-- Inner V-Spurs -->
      <path d="M -6 -10 L 0 -17 L 6 -10" fill="none" />
    </g>
    <!-- Rotate the branch to create a perfect 6-axis crystal -->
    <use href="#branch" transform="rotate(60)" />
    <use href="#branch" transform="rotate(120)" />
    <use href="#branch" transform="rotate(180)" />
    <use href="#branch" transform="rotate(240)" />
    <use href="#branch" transform="rotate(300)" />
    
    <!-- Central core ring -->
    <circle cx="0" cy="0" r="7.5" fill="#0f172a" stroke="url(#coolGradient)" stroke-width="4.5" />
  </g>
</svg>
